name: Daily random README commits

on:
  schedule:
    # 14:37 UTC is 8:07 PM in India.
    - cron: "37 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-readme-commit
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create 1 to 6 daily commits and push
        shell: bash
        run: |
          set -euo pipefail

          branch="${GITHUB_REF_NAME}"
          today="$(TZ=Asia/Kolkata date +%F)"
          batch_marker="<!-- daily-batch:${today} -->"

          git config user.name "Ritesh102000"
          git config user.email "141893988+Ritesh102000@users.noreply.github.com"

          # Start from the newest remote commit even if this run was queued earlier.
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"

          if grep -Fqx -- "$batch_marker" README.md; then
            echo "Daily commit batch already exists for ${today}."
            exit 0
          fi

          commit_count=$((RANDOM % 6 + 1))
          echo "Creating ${commit_count} commits for ${today}."

          for ((i = 1; i <= commit_count; i++)); do
            if ((i == 1)); then
              printf '\n%s\n' "$batch_marker" >> README.md
            fi

            printf -- '- %s: automated daily update %d of %d\n' \
              "$today" "$i" "$commit_count" >> README.md

            git add README.md
            git commit -m "chore: daily update ${today} (${i}/${commit_count})"
          done

          # If main changed during this job, rebase and retry up to three times.
          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              exit 0
            fi

            echo "Push attempt ${attempt} failed; rebasing onto latest ${branch}."
            git fetch origin "$branch"
            git rebase "origin/$branch"
          done

          echo "Push failed after three attempts."
          exit 1
