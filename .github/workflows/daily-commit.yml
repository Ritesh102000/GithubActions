name: Daily README commit

on:
  schedule:
    # 14:37 UTC is 8:07 PM in India.
    - cron: "37 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-readme-commit
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add daily update and push
        shell: bash
        run: |
          set -euo pipefail

          today="$(TZ=Asia/Kolkata date +%F)"
          entry="- ${today}: automated daily update"

          if grep -Fqx -- "$entry" README.md; then
            echo "Daily entry already exists for ${today}."
            exit 0
          fi

          printf '\n%s\n' "$entry" >> README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: daily README update ${today}"
          git push
